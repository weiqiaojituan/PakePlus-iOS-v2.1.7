<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>粒度占比计算器</title>
	<style>
		:root {
			--primary: #4A00E0;
			--secondary: #8E2DE2;
			--success: #00c853;
			--bg: #f5f7fa;
		}

		* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
		
		body { background: var(--bg); padding: 10px; color: #333; padding-bottom: 40px; }

		/* 顶部提示条 */
		#toast {
			position: fixed;
			top: -50px;
			left: 50%;
			transform: translateX(-50%);
			background: rgba(0,0,0,0.8);
			color: white;
			padding: 8px 20px;
			border-radius: 20px;
			font-size: 14px;
			z-index: 1000;
			transition: top 0.3s ease;
		}

		.container {
			background: white;
			border-radius: 15px;
			box-shadow: 0 4px 15px rgba(0,0,0,0.05);
			max-width: 500px;
			margin: 0 auto;
			overflow: hidden;
		}

		.header {
			background: linear-gradient(135deg, var(--primary), var(--secondary));
			color: white;
			padding: 20px 15px;
			text-align: center;
		}

		.content { padding: 15px; }

		.input-group { margin-bottom: 15px; }
		.input-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #666; font-weight: bold; }
		
		input {
			width: 100%;
			padding: 12px;
			border: 1px solid #ddd;
			border-radius: 10px;
			font-size: 15px;
			background: #fafafa;
		}

		#sampleName { border-left: 5px solid var(--secondary); font-weight: bold; }

		.variety-item {
			background: #fff;
			border: 1px solid #eee;
			border-radius: 12px;
			padding: 12px;
			margin-bottom: 10px;
			position: relative;
		}

		.item-ctrl { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
		.item-ctrl span { font-size: 12px; color: #999; }
		.remove-btn { color: #ff5252; border: none; background: none; font-size: 20px; padding: 0 10px; }

		.grid-inputs { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; }

		.action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
		
		button {
			border-radius: 10px;
			padding: 14px;
			font-size: 15px;
			font-weight: bold;
			border: none;
			cursor: pointer;
			active-opacity: 0.8;
		}

		.btn-add { background: #f0ebff; color: var(--primary); grid-column: span 2; }
		.btn-calc { background: var(--primary); color: white; }
		.btn-reset { background: #eee; color: #666; }

		/* 结果区域 */
		#resultArea {
			margin-top: 20px;
			padding: 15px;
			background: #f8faff;
			border-radius: 12px;
			display: none;
			border: 1px solid #e1e8ff;
		}

		.res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
		.res-card { background: white; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #eee; }
		.res-card .p { color: var(--primary); font-size: 18px; font-weight: bold; }
		.res-card .n { font-size: 12px; color: #777; margin-top: 4px; }

		.copy-box {
			background: var(--success);
			color: white;
			width: 100%;
			margin-top: 10px;
		}

		.copyright { text-align: center; font-size: 12px; color: #ccc; margin-top: 20px; }
	</style>
</head>
<body>

	<div id="toast">已同步更新</div>

	<div class="container">
		<div class="header">
			<h2>粒度占比计算器</h2>
			<p></p>
		</div>

		<div class="content">
			<div class="input-group">
				<label>取样名称</label>
				<input type="text" id="sampleName" placeholder="例如：1号原煤" oninput="saveData()">
			</div>

			<div id="listContainer">
				</div>

			<button class="btn-add" onclick="addItem()">+ 添加粒度区间</button>

			<div class="action-btns">
				<button class="btn-calc" onclick="doCalc()">开始计算</button>
				<button class="btn-reset" onclick="doReset()">重置清空</button>
			</div>

			<div id="resultArea">
				<h4 style="text-align:center; color:#4A00E0">分析结果</h4>
				<div id="totalDisplay" style="text-align:center; font-size:14px; margin:5px 0; color:#666"></div>
				<div class="res-grid" id="resGrid"></div>
				<button class="copy-box" onclick="doCopy()">点击复制完整文本</button>
				<textarea id="hiddenCopyText" style="position:absolute; left:-9999px;"></textarea>
			</div>
		</div>
		
		<div class="copyright">计算人∶刘飞</div>
	</div>

<script>
	const STORAGE_KEY = 'particle_calc_data';

	// 屏幕提示函数
	function showToast(msg) {
		const t = document.getElementById('toast');
		t.innerText = msg;
		t.style.top = '20px';
		setTimeout(() => { t.style.top = '-50px'; }, 2000);
	}

	// 初始化加载
	window.onload = () => {
		const saved = localStorage.getItem(STORAGE_KEY);
		if (saved) {
			const data = JSON.parse(saved);
			document.getElementById('sampleName').value = data.name || '';
			data.items.forEach(item => addItem(item.n, item.w));
		} else {
			// 默认初始项
			addItem('12mm以上', '');
			addItem('3-12mm', '');
			addItem('3mm以下', '');
		}
	};

	function addItem(n = '', w = '') {
		const container = document.getElementById('listContainer');
		const div = document.createElement('div');
		div.className = 'variety-item';
		div.innerHTML = `
			<div class="item-ctrl">
				<span>区间项目</span>
				<button class="remove-btn" onclick="removeItem(this)">×</button>
			</div>
			<div class="grid-inputs">
				<input type="text" class="i-n" value="${n}" placeholder="名称" oninput="saveData()">
				<input type="number" class="i-w" value="${w}" placeholder="重量(g)" oninput="saveData()" step="any">
			</div>
		`;
		container.appendChild(div);
	}

	function removeItem(btn) {
		if (document.querySelectorAll('.variety-item').length > 1) {
			btn.closest('.variety-item').remove();
			saveData();
		} else {
			showToast('至少保留一项');
		}
	}

	// 自动保存
	function saveData() {
		const items = [];
		document.querySelectorAll('.variety-item').forEach(el => {
			items.push({
				n: el.querySelector('.i-n').value,
				w: el.querySelector('.i-w').value
			});
		});
		const data = {
			name: document.getElementById('sampleName').value,
			items: items
		};
		localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
	}

	// 计算逻辑
	function doCalc() {
		const weights = document.querySelectorAll('.i-w');
		const names = document.querySelectorAll('.i-n');
		const sName = document.getElementById('sampleName').value || '未命名样';
		
		let total = 0;
		let validData = [];

		weights.forEach((wEl, i) => {
			let val = parseFloat(wEl.value) || 0;
			if (val > 0) {
				total += val;
				validData.push({ n: names[i].value || `粒度${i+1}`, w: val });
			}
		});

		if (total === 0) {
			showToast('请输入重量数据');
			return;
		}

		// 渲染屏幕结果
		const grid = document.getElementById('resGrid');
		grid.innerHTML = '';
		let copyStr = `【${sName}】粒度分析\n总重量: ${total.toFixed(2)}g\n\n`;

		validData.forEach(item => {
			const ratio = ((item.w / total) * 100).toFixed(2);
			copyStr += `${item.n}: ${item.w}g (${ratio}%)\n`;
			
			grid.innerHTML += `
				<div class="res-card">
					<div class="p">${ratio}%</div>
					<div class="n">${item.n}</div>
				</div>
			`;
		});

		document.getElementById('totalDisplay').innerText = `总重: ${total.toFixed(2)}g`;
		document.getElementById('hiddenCopyText').value = copyStr;
		document.getElementById('resultArea').style.display = 'block';
		
		showToast('计算完成');
		window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
	}

	// 增强版复制功能
	function doCopy() {
		const text = document.getElementById('hiddenCopyText').value;
		const textArea = document.getElementById('hiddenCopyText');
		
		// 方案1: Clipboard API
		if (navigator.clipboard && window.isSecureContext) {
			navigator.clipboard.writeText(text).then(() => {
				showToast('复制成功！可直接粘贴');
			}).catch(err => {
				fallbackCopy(textArea);
			});
		} else {
			fallbackCopy(textArea);
		}
	}

	// 备用复制方案 (兼容老款手机或微信环境)
	function fallbackCopy(textArea) {
		textArea.select();
		textArea.setSelectionRange(0, 99999); // 兼容iOS
		try {
			document.execCommand('copy');
			showToast('复制成功！');
		} catch (err) {
			showToast('复制失败，请手动长按结果');
		}
	}

	function doReset() {
		if (confirm('确定要清空所有数据吗？')) {
			localStorage.removeItem(STORAGE_KEY);
			location.reload();
		}
	}
</script>
</body>
</html>
